<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vakhta">
  <rect width="64" height="64" rx="14" fill="#10161c"/>
  <!-- 24-hour dial: the amber half is the day shift, the light half the night shift -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#2a333c" stroke-width="6"/>
  <path d="M32 11a21 21 0 0 1 0 42" fill="none" stroke="#f0a93b" stroke-width="6" stroke-linecap="round"/>
  <path d="M32 53a21 21 0 0 1 0-42" fill="none" stroke="#e7ecf1" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 9"/>
  <!-- hands: shift start at 7 o'clock -->
  <path d="M32 32V19" stroke="#e7ecf1" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 32l-8 6" stroke="#f0a93b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.2" fill="#e7ecf1"/>
</svg>
