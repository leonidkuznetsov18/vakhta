name: DB backup

# Щоночі pg_dump продакшен-бази в приватний бакет R2/S3 (docs/runbooks/recovery.md).
# Секрети репозиторію: PROD_DATABASE_URL, BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET,
# BACKUP_S3_ACCESS_KEY, BACKUP_S3_SECRET_KEY. Ротацію старих копій робить lifecycle бакета.
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.DB_BACKUP_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Клієнт PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 >/dev/null

      - name: Дамп і завантаження
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: scripts/db/backup.sh
