packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 не запускає postinstall-скрипти залежностей без явного дозволу.
# esbuild потрібен Vite і tsx; msgpackr-extract є необов'язковим прискорювачем для BullMQ.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - msgpackr-extract

# Shared direct dependencies, pinned to the existing lockfile resolutions.
catalog:
  '@aws-sdk/client-s3': '3.1127.0'
  '@sentry/node': '10.73.0'
  '@testcontainers/postgresql': '11.14.0'
  '@types/luxon': '3.7.5'
  '@types/node': '22.20.1'
  '@types/qrcode': '1.5.6'
  'concurrently': '9.2.4'
  'grammy': '1.46.0'
  'ioredis': '5.11.1'
  'luxon': '3.7.2'
  'pino': '9.14.0'
  'pino-pretty': '13.1.3'
  'qrcode': '1.5.4'
  'sharp': '0.34.5'
  'typescript': '5.9.3'
  'vite': '7.3.6'
  'vitest': '3.2.7'
  'zod': '4.5.4'
